name = "drewrys-store"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Static assets served from ./public — img/ and shell.html.
#
# NOTE, deliberately: the site is public/shell.html, NOT public/index.html.
# An index.html at the root of the assets directory wins the "/" route before
# the Worker ever runs, which is what stopped ministry-nutrition's Worker from
# serving its homepage. Naming it shell.html leaves "/" unclaimed, so the
# Worker owns it and can inject the catalogue. Do not add a public/index.html
# and do not add run_worker_first — neither is needed while this holds.
[assets]
directory = "./public"
binding = "ASSETS"

# Catalogue, stock and orders.
[[kv_namespaces]]
binding = "DREWRYS_KV"
id = "7ab8ffff01814fb78607261c7111c51d"

# Logs in the dashboard. This MUST live here, not just be switched on in the
# UI: every deploy rebuilds the Worker's config from this file, so anything
# not declared here is reset to its default on the next push. That is why it
# kept turning itself off.
#
# head_sampling_rate = 1 logs every request. Drop it to 0.1 if the volume ever
# gets noisy; at Drewrys' traffic it will not.
[observability]
enabled = true
head_sampling_rate = 1

# Reporting: visit counts and a mirror of every paid order.
# Create with: Workers & Pages > D1 > Create database > drewrys-analytics
# then paste its id here.
[[d1_databases]]
binding = "DB"
database_name = "drewrys-analytics"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"

# Daily cron. Sends review requests that have come due; the queue carries its
# own timestamps so the hour is not critical. 09:00 UTC.
[triggers]
crons = ["0 9 * * *"]

[vars]
SHOP_NAME = "Drewrys"
SITE_ORIGIN = "https://drewrys.store"
TEYA_ENV = "staging"

# Secrets — set these in the Cloudflare dashboard under the Worker's
# Settings › Variables and Secrets (encrypted). Not here, and not via
# wrangler, which isn't available on a Chromebook.
#
#   ADMIN_KEY             PIN for /admin
#   TEYA_API_KEY          from Ben's Teya Business Portal
#   TEYA_STORE_ID         GB1953MQ (the Drewrys store profile)
#   TEYA_WEBHOOK_SECRET   captured when the webhook is created
#   SENDGRID_API_KEY      order emails
#   SHOP_ORDER_EMAIL      where Ben receives order notifications
#   SHOP_FROM_EMAIL       verified SendGrid sender
